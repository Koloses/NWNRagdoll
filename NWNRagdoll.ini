; NWNRagdoll - physics for Neverwinter Nights: Enhanced Edition (ragdolls, falling weapons, cloth, debris, blasts)
[Ragdoll]
Enabled=1
; single player: move the corpse under the body once it has settled (looting / selecting follow)
MoveCorpseSinglePlayer=1
; on a remote server the corpse object stays put; the body is simulated on your side only.
; Keep it within this many metres of the real corpse (0 = no limit)
MultiplayerPinRadius=0
; how hard the body is knocked over, away from the killer (m/s at head height)
DeathPush=2.0
; the death animation plays this long before the physics takes over (seconds, 0 = at once)
DeathAnimationSeconds=0.24
; muscle tone that fades over the first second and a half (0 = limp at once, 1 = normal)
MuscleTone=1.0
; weapons and shields fall from the hands
DropWeapons=1
; simulation time limit per body (seconds)
MaxSimulationSeconds=6
; bodies simulated at the same time
MaxActive=10
; only creatures this close to you (metres)
Range=45
; walking through a body kicks it along
KickBodies=1
KickStrength=2.0
; the dead stay instead of fading away (until you leave the area)
KeepCorpses=1
; kept bodies per area; the oldest fade away beyond this
MaxCorpses=60
Debug=0

[Blood]
; a pool of blood (red, green or yellow, by the creature) spreads under bodies that bleed and stays until you leave the area
Enabled=1
; size of a full pool (1 = normal)
PoolSize=1.0
; pools in one area; the oldest are reused beyond this
MaxPools=48

[Physics]
; fireballs, meteor swarms, ice storms ... throw bodies, dropped weapons and debris around
Explosions=1
; bashed barrels, crates and other placeables break into pieces (single player)
Debris=1
; how long the pieces stay before they sink away (seconds)
DebrisSeconds=20
; cloaks, tabards, belt flaps and loincloths swing
Cloth=1
; how strongly the cloth keeps the shape of the animation (lower = looser)
ClothStiffness=1.0

[Developer]
; testing: a file with commands (kill, blast, debris ...); leave empty
CommandFile=
