; NWNRagdoll - ragdoll physics for dying creatures (Neverwinter Nights: Enhanced Edition)
[Ragdoll]
Enabled=1
; single player: move the corpse under the body once it has settled (looting / selecting follow)
MoveCorpseSinglePlayer=1
; on a remote server the corpse stays put: the body may end up at most this far from it (metres)
MultiplayerPinRadius=0.6
; speed of the upper body away from the killer at the moment of death (m/s)
DeathPush=1.2
; simulation time limit per body (seconds)
MaxSimulationSeconds=6
; bodies simulated at the same time
MaxActive=10
; only creatures this close to you (metres)
Range=45
Debug=0

[Developer]
; testing: a file with "kill <client object id>"; leave empty
CommandFile=
